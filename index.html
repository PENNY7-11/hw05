<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣夜市懷舊小瑪莉彈珠台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Matter.js 0.19.0 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        /* 七彩霓虹邊框 CSS 動畫 */
        @keyframes rainbow-border {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            20% { border-color: #ff7f00; box-shadow: 0 0 15px #ff7f00; }
            40% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
            60% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
            80% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }
        .neon-frame {
            border: 8px solid #ff0000;
            animation: rainbow-border 4s infinite;
        }
        /* 燈號發光特效 */
        .lamp-active {
            background-color: #facc15 !important;
            box-shadow: 0 0 20px #facc15, 0 0 40px #eab308 !important;
            color: #713f12 !important;
            border-color: #fef08a !important;
        }
        .lamp-running {
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-2 select-none">

    <!-- 遊戲機台外框容器 -->
    <div class="w-full max-w-sm bg-red-700 rounded-2xl neon-frame p-3 flex flex-col gap-2 shadow-2xl relative overflow-hidden">

        <!-- 頂部燈箱 -->
        <div class="bg-yellow-300 border-4 border-red-900 rounded-lg p-2 flex flex-col gap-2 relative shadow-inner">
            <!-- 左側金屬投幣口 -->
            <div class="absolute left-2 top-2 w-9 h-11 bg-gray-300 border-2 border-gray-500 rounded flex flex-col items-center justify-center shadow">
                <div class="w-5 h-1 bg-gray-700 rounded mb-1"></div>
                <div class="text-[8px] text-black font-bold">COIN</div>
            </div>
            <!-- 右側黃色喇叭網罩 -->
            <div class="absolute right-2 top-2 w-8 h-8 bg-yellow-500 border-2 border-yellow-700 rounded-full flex items-center justify-center shadow">
                <div class="w-4 h-4 bg-yellow-700 rounded-full opacity-60 grid grid-cols-2 gap-0.5 p-0.5">
                    <div class="bg-yellow-900 rounded-full"></div>
                    <div class="bg-yellow-900 rounded-full"></div>
                    <div class="bg-yellow-900 rounded-full"></div>
                    <div class="bg-yellow-900 rounded-full"></div>
                </div>
            </div>

            <!-- 卡通機器人標題 (Inline SVG) -->
            <div class="flex items-center justify-center gap-2 mt-1">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="6" width="16" height="14" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
                    <circle cx="9" cy="11" r="2" fill="#facc15"/>
                    <circle cx="15" cy="11" r="2" fill="#facc15"/>
                    <rect x="8" y="15" width="8" height="2" rx="1" fill="#ef4444"/>
                    <rect x="11" y="2" width="2" height="4" fill="#64748b"/>
                    <circle cx="12" cy="2" r="1.5" fill="#ef4444"/>
                </svg>
                <div class="text-center">
                    <h1 class="text-red-700 font-black text-lg tracking-wider drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">台灣夜市小瑪莉</h1>
                    <p class="text-[10px] text-red-900 font-bold">懷舊彈珠台</p>
                </div>
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="6" width="16" height="14" rx="2" fill="#10b981" stroke="#065f46" stroke-width="2"/>
                    <circle cx="9" cy="11" r="2" fill="#facc15"/>
                    <circle cx="15" cy="11" r="2" fill="#facc15"/>
                    <path d="M8 15H16" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
                    <rect x="11" y="2" width="2" height="4" fill="#64748b"/>
                </svg>
            </div>

            <!-- 5個倍率燈 (2x, 4x, 6x, 8x, 10x) -->
            <div class="flex justify-around items-center bg-red-950 p-1.5 rounded-lg border-2 border-yellow-500">
                <div id="lamp-2" class="w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200">2X</div>
                <div id="lamp-4" class="w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200">4X</div>
                <div id="lamp-6" class="w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200">6X</div>
                <div id="lamp-8" class="w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200">8X</div>
                <div id="lamp-10" class="w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200">10X</div>
            </div>
        </div>

        <!-- 狀態資訊欄 (HUD) -->
        <div class="flex justify-between items-center bg-black/50 px-3 py-1.5 rounded-lg border border-red-900 text-xs font-bold">
            <div>代幣: <span id="coins-display" class="text-yellow-400 text-sm">100</span></div>
            <div>押分: <span id="bet-display" class="text-yellow-400 text-sm">5</span></div>
            <div class="flex items-center gap-1">
                <button onclick="toggleAudio()" id="audio-btn" class="bg-red-800 px-2 py-0.5 rounded text-[10px] border border-red-600">音效: 開</button>
            </div>
        </div>

        <!-- 遊戲主盤面 (Canvas 渲染區 + 12槽標示) -->
        <div class="relative w-full bg-yellow-200 border-4 border-red-900 rounded-lg overflow-hidden shadow-inner flex flex-col">
            <div id="canvas-container" class="w-full h-[320px] relative"></div>
            
            <!-- 底部 12 槽中獎狀態標示列 -->
            <div id="slots-indicator" class="grid grid-cols-12 bg-red-950 border-t-2 border-red-900 text-center py-1 text-[9px] font-bold text-yellow-300">
                <!-- 動態生成 1-12 槽標示 -->
            </div>

            <!-- 狀態提示覆蓋層 -->
            <div id="game-msg" class="absolute inset-x-0 top-1/3 flex items-center justify-center pointer-events-none transition-opacity duration-300 opacity-0">
                <span class="bg-black/80 text-yellow-300 px-4 py-2 rounded-xl font-black text-base border-2 border-yellow-500 shadow-xl" id="game-msg-text">請按下黃色大按鈕！</span>
            </div>
        </div>

        <!-- 操作面板區 -->
        <div class="bg-red-800 border-2 border-red-900 rounded-xl p-2.5 flex flex-col gap-2.5 shadow-lg">
            
            <!-- 押分控制與大按鈕列 -->
            <div class="flex items-center justify-between gap-2">
                <!-- 押分調整 -->
                <div class="flex flex-col items-center bg-black/40 p-1.5 rounded border border-red-900">
                    <span class="text-[10px] text-yellow-300 mb-1">投入彈珠 (1-99)</span>
                    <div class="flex items-center gap-1">
                        <button onclick="adjustBet(-1)" class="w-7 h-7 bg-red-600 hover:bg-red-500 active:scale-95 rounded font-bold text-white shadow">-</button>
                        <input type="number" id="bet-input" value="5" min="1" max="99" onchange="updateBetInput(this.value)" class="w-10 text-center bg-black text-yellow-400 font-bold rounded text-sm py-0.5 border border-yellow-500">
                        <button onclick="adjustBet(1)" class="w-7 h-7 bg-red-600 hover:bg-red-500 active:scale-95 rounded font-bold text-white shadow">+</button>
                    </div>
                </div>

                <!-- 醒目的黃色大按鈕 -->
                <button id="start-btn" onclick="startRollingAndPlay()" class="flex-1 h-12 bg-gradient-to-t from-yellow-600 to-yellow-400 hover:from-yellow-500 hover:to-yellow-300 active:scale-95 border-2 border-yellow-200 rounded-xl font-black text-red-950 text-base shadow-[0_4px_0_#9a3412] active:shadow-none active:translate-y-1 transition-all flex items-center justify-center gap-1">
                    <span>🔥 開始抽倍率</span>
                </button>
            </div>

            <!-- 下方細節控制列 (鑰匙孔、彈簧拉桿區、接珠槽) -->
            <div class="flex justify-between items-center px-1">
                <!-- 裝飾鑰匙孔 -->
                <div class="w-6 h-6 rounded-full bg-gray-400 border-2 border-gray-600 flex items-center justify-center shadow">
                    <div class="w-1 h-3 bg-black"></div>
                </div>

                <!-- 彈簧拉桿視覺與提示 -->
                <div id="launcher-area" class="flex items-center gap-1.5 bg-black/30 px-2.5 py-1 rounded-lg border border-red-900 cursor-pointer select-none">
                    <span class="text-[10px] text-yellow-200 font-bold" id="pull-hint">下拉拉桿發射</span>
                    <div class="w-4 h-8 bg-yellow-500 rounded border border-yellow-700 relative flex items-center justify-center">
                        <div id="pull-handle" class="absolute w-6 h-3 bg-red-600 rounded shadow-md border border-yellow-200 transition-all" style="bottom: 2px;"></div>
                    </div>
                </div>

                <!-- 紅色接珠槽裝飾 -->
                <div class="w-14 h-4 bg-red-950 rounded-b-lg border border-red-900 flex justify-center items-center shadow-inner">
                    <div class="w-8 h-1 bg-red-800 rounded"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- 破產重置彈窗 Modal -->
    <div id="gameover-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-red-900 border-4 border-yellow-400 rounded-2xl p-6 text-center flex flex-col gap-4 max-w-xs w-full shadow-2xl">
            <h2 class="text-xl font-black text-yellow-300">代幣已用盡！</h2>
            <p class="text-xs text-white">夜市老闆看你很有潛力，決定免費讓你再投一次幣！</p>
            <button onclick="resetGameCoins()" class="bg-yellow-400 hover:bg-yellow-300 text-red-950 font-black py-2.5 rounded-xl text-base shadow-lg active:scale-95 transition-all">
                再投一次 (100代幣)
            </button>
        </div>
    </div>

    <!-- 遊戲完整邏輯 Script -->
    <script>
        /**
         * 【可調整參數設定物件】
         */
        const CONFIG = {
            initialCoins: 100,           // 初始代幣
            gravityY: 1.0,               // 盤面重力
            pegRestitution: 0.75,        // 釘子彈性
            ballRestitution: 0.6,        // 彈珠彈性
            ballFriction: 0.002,         // 彈珠摩擦力
            pegSpacingX: 38,             // 釘子水平間距
            pegSpacingY: 34,             // 釘子垂直間距
            minLaunchPower: 12,          // 最小發射力道
            maxLaunchPower: 26,          // 最大發射力道
            ballInterval: 300,           // 多顆彈珠發射間隔 (毫秒)
            stuckTimeout: 5000           // 彈珠卡住超時判斷 (毫秒)
        };

        // 賠率燈號權重設定 (總權重 12)
        const MULTIPLIER_POOL = [
            { mult: 2, weight: 4 },
            { mult: 4, weight: 3 },
            { mult: 6, weight: 3 },
            { mult: 8, weight: 1 },
            { mult: 10, weight: 1 }
        ];

        // 各倍率對應的中獎槽設定 (1~12槽，注意陣列索引 0-11)
        const WINNING_SLOTS_MAP = {
            2: [1, 4, 7, 10],   // 第 2, 5, 8, 11 槽
            4: [2, 5, 9],        // 第 3, 6, 10 槽
            6: [2, 6, 9],        // 第 3, 7, 10 槽
            8: [1],              // 第 2 槽
            10: [10]             // 第 11 槽
        };

        // 遊戲狀態變數
        let coins = CONFIG.initialCoins;
        let currentBet = 5;
        let currentMultiplier = 0;
        let gameState = 'IDLE'; // IDLE, ROLLING, READY_TO_LAUNCH, LAUNCHING, FINISHED
        let activeBalls = [];
        let pendingBallsCount = 0;
        let winningSlotsForCurrentGame = [];
        let isAudioEnabled = true;

        // Web Audio API 音效合成器
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'bounce') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'win') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } else if (type === 'tick') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audio-btn').innerText = `音效: ${isAudioEnabled ? '開' : '關'}`;
        }

        // 初始化 12 槽標示列
        const slotsIndicatorEl = document.getElementById('slots-indicator');
        for (let i = 1; i <= 12; i++) {
            let div = document.createElement('div');
            div.id = `slot-label-${i}`;
            div.innerText = i;
            div.className = "border-r border-red-900 last:border-r-0 py-0.5 text-gray-400";
            slotsIndicatorEl.appendChild(div);
        }

        function updateUI() {
            document.getElementById('coins-display').innerText = coins;
            document.getElementById('bet-display').innerText = currentBet;
        }

        function adjustBet(amount) {
            if (gameState !== 'IDLE' && gameState !== 'FINISHED') return;
            currentBet += amount;
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 99) currentBet = 99;
            if (currentBet > coins) currentBet = coins;
            document.getElementById('bet-input').value = currentBet;
            updateUI();
        }

        function updateBetInput(val) {
            if (gameState !== 'IDLE' && gameState !== 'FINISHED') return;
            let num = parseInt(val) || 1;
            if (num < 1) num = 1;
            if (num > 99) num = 99;
            if (num > coins) num = coins;
            currentBet = num;
            document.getElementById('bet-input').value = currentBet;
            updateUI();
        }

        // Matter.js 物理引擎初始化
        const { Engine, Render, Runner, Bodies, Composite, Events, Body, Vector } = Matter;

        const container = document.getElementById('canvas-container');
        const width = container.clientWidth || 320;
        const height = container.clientHeight || 320;

        const engine = Engine.create();
        const world = engine.world;
        world.gravity.y = CONFIG.gravityY;

        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: '#fef08a'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 建立機台邊界與右側發射軌道
        const wallOptions = { isStatic: true, render: { fillStyle: '#b91c1c' } };
        Composite.add(world, [
            Bodies.rectangle(width / 2, -10, width, 20, wallOptions), // 頂
            Bodies.rectangle(-10, height / 2, 20, height, wallOptions), // 左
            Bodies.rectangle(width + 10, height / 2, 20, height, wallOptions), // 右
            Bodies.rectangle(width - 35, height * 0.45, 8, height * 0.7, wallOptions) // 發射道隔板
        ]);

        // 建立交錯（錯位）釘子陣列 (Pegs)
        const pegRows = 5;
        const pegCols = 6;
        const startX = 40;
        const startY = 60;
        
        for (let r = 0; r < pegRows; r++) {
            let numCols = (r % 2 === 0) ? pegCols : pegCols - 1;
            let offsetX = (r % 2 === 0) ? startX : startX + CONFIG.pegSpacingX / 2;
            for (let c = 0; c < numCols; c++) {
                let x = offsetX + c * CONFIG.pegSpacingX;
                let y = startY + r * CONFIG.pegSpacingY;
                let peg = Bodies.circle(x, y, 5.5, {
                    isStatic: true,
                    render: { fillStyle: '#ea580c' },
                    restitution: CONFIG.pegRestitution
                });
                Composite.add(world, peg);
            }
        }

        // 底部 12 條入球槽隔板
        const numSlots = 12;
        const slotWidth = (width - 35) / numSlots;
        const slotY = height - 30;

        for (let i = 0; i <= numSlots; i++) {
            let x = i * slotWidth;
            let divider = Bodies.rectangle(x, slotY + 15, 3, 50, {
                isStatic: true,
                render: { fillStyle: '#991b1b' }
            });
            Composite.add(world, divider);
        }

        // 碰撞音效觸發
        Events.on(engine, 'collisionStart', (event) => {
            let pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                let p = pairs[i];
                if (p.bodyA.label === 'ball' || p.bodyB.label === 'ball') {
                    playSound('bounce');
                }
            }
        });

        // 燈號重置與點亮
        function resetAllLamps() {
            [2, 4, 6, 8, 10].forEach(m => {
                let el = document.getElementById(`lamp-${m}`);
                el.className = "w-11 h-7 rounded bg-gray-800 border border-yellow-600 flex items-center justify-center text-xs font-bold text-gray-400 transition-all duration-200";
            });
        }

        function highlightLamp(mult) {
            resetAllLamps();
            let el = document.getElementById(`lamp-${mult}`);
            if (el) {
                el.className = "w-11 h-7 rounded bg-yellow-400 border border-yellow-200 flex items-center justify-center text-xs font-bold text-red-950 lamp-active scale-110 shadow-lg";
            }
        }

        // 更新底部槽的中獎視覺標示
        function updateSlotsIndicator() {
            for (let i = 1; i <= 12; i++) {
                let labelEl = document.getElementById(`slot-label-${i}`);
                if (winningSlotsForCurrentGame.includes(i - 1)) {
                    labelEl.className = "border-r border-red-900 last:border-r-0 py-0.5 bg-red-600 text-white font-black animate-pulse";
                } else {
                    labelEl.className = "border-r border-red-900 last:border-r-0 py-0.5 text-gray-400";
                }
            }
        }

        function clearSlotsIndicator() {
            for (let i = 1; i <= 12; i++) {
                let labelEl = document.getElementById(`slot-label-${i}`);
                labelEl.className = "border-r border-red-900 last:border-r-0 py-0.5 text-gray-400";
            }
        }

        // 顯示提示訊息
        function showMessage(text, duration = 1500) {
            const msgEl = document.getElementById('game-msg');
            const textEl = document.getElementById('game-msg-text');
            textEl.innerText = text;
            msgEl.style.opacity = '1';
            if (duration > 0) {
                setTimeout(() => {
                    msgEl.style.opacity = '0';
                }, duration);
            }
        }

        // 1. 點擊黃色大按鈕：抽倍率程序
        function startRollingAndPlay() {
            if (gameState === 'ROLLING' || gameState === 'LAUNCHING') return;

            if (coins < currentBet) {
                document.getElementById('gameover-modal').classList.remove('hidden');
                return;
            }

            // 扣除代幣
            coins -= currentBet;
            updateUI();

            gameState = 'ROLLING';
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').classList.add('opacity-50');
            clearSlotsIndicator();

            showMessage("🎲 正在隨機抽取本局倍率...", 0);

            // 跑馬燈動畫效果 (約 1.5 秒)
            let multipliers = [2, 4, 6, 8, 10];
            let counter = 0;
            let rollInterval = setInterval(() => {
                let randomTemp = multipliers[Math.floor(Math.random() * multipliers.length)];
                let tempEl = document.getElementById(`lamp-${randomTemp}`);
                resetAllLamps();
                tempEl.classList.add('lamp-running');
                playSound('tick');
                counter++;

                if (counter > 15) {
                    clearInterval(rollInterval);
                    finalizeMultiplierSelection();
                }
            }, 90);
        }

        // 決定最終倍率與對應中獎槽
        function finalizeMultiplierSelection() {
            // 加權隨機抽取
            let totalWeight = MULTIPLIER_POOL.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;
            let selected = MULTIPLIER_POOL[0].mult;

            for (let item of MULTIPLIER_POOL) {
                currentSum += item.weight;
                if (randomNum <= currentSum) {
                    selected = item.mult;
                    break;
                }
            }

            currentMultiplier = selected;
            winningSlotsForCurrentGame = WINNING_SLOTS_MAP[currentMultiplier] || [1, 4, 7, 10];

            highlightLamp(currentMultiplier);
            updateSlotsIndicator();
            playSound('coin');

            gameState = 'READY_TO_LAUNCH';
            document.getElementById('start-btn').innerText = "請向下拉桿發射";
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.remove('opacity-50');

            showMessage(`🎯 抽中 ${currentMultiplier} 倍！請拉動右側發射拉桿`, 2500);
        }

        // 2. 發射機制 (支援滑鼠與觸控拖曳拉桿)
        let isDragging = false;
        let dragStartY = 0;
        let pullDistance = 0;
        const launcherArea = document.getElementById('launcher-area');
        const pullHandle = document.getElementById('pull-handle');

        launcherArea.addEventListener('pointerdown', (e) => {
            if (gameState !== 'READY_TO_LAUNCH') return;
            isDragging = true;
            dragStartY = e.clientY;
            launcherArea.setPointerCapture(e.pointerId);
        });

        launcherArea.addEventListener('pointermove', (e) => {
            if (!isDragging || gameState !== 'READY_TO_LAUNCH') return;
            let deltaY = e.clientY - dragStartY;
            pullDistance = Math.max(0, Math.min(deltaY, 40)); // 限制拉動距離 0-40px
            pullHandle.style.bottom = `${2 - pullDistance}px`;
            document.getElementById('pull-hint').innerText = `力道: ${Math.round(pullDistance * 0.6 + 5)}`;
        });

        launcherArea.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            pullHandle.style.bottom = '2px';
            document.getElementById('pull-hint').innerText = "下拉拉桿發射";

            if (gameState === 'READY_TO_LAUNCH') {
                // 計算發射力道
                let powerRatio = pullDistance / 40; // 0 到 1
                let launchPower = CONFIG.minLaunchPower + powerRatio * (CONFIG.maxLaunchPower - CONFIG.minLaunchPower);
                if (pullDistance < 5) launchPower = CONFIG.minLaunchPower; // 預設最小力道

                executeLaunchSequence(launchPower);
            }
            pullDistance = 0;
        });

        // 執行多顆彈珠依序發射程序
        function executeLaunchSequence(power) {
            gameState = 'LAUNCHING';
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').classList.add('opacity-50');
            document.getElementById('start-btn').innerText = "🔥 發射中...";

            pendingBallsCount = currentBet;
            
            let launchTimer = setInterval(() => {
                if (pendingBallsCount <= 0) {
                    clearInterval(launchTimer);
                    return;
                }

                // 建立彈珠
                let ball = Bodies.circle(width - 18, height - 40, 7.5, {
                    restitution: CONFIG.ballRestitution,
                    friction: CONFIG.ballFriction,
                    render: { fillStyle: '#ffffff' },
                    label: 'ball'
                });
                ball.spawnTime = Date.now();
                Composite.add(world, ball);
                activeBalls.push(ball);
                playSound('bounce');

                // 給予向上初速
                Body.setVelocity(ball, { x: 0, y: -power });

                pendingBallsCount--;
            }, CONFIG.ballInterval);
        }

        // 3. 物理引擎更新迴圈：檢查彈珠是否入袋或卡住
        let totalWinThisGame = 0;
        let settledBallsCount = 0;
        let gameResultsSummary = [];

        Events.on(engine, 'afterUpdate', () => {
            if (gameState !== 'LAUNCHING') return;

            let now = Date.now();
            for (let i = activeBalls.length - 1; i >= 0; i--) {
                let ball = activeBalls[i];

                // 檢查是否卡住超過 5 秒
                if (now - ball.spawnTime > CONFIG.stuckTimeout) {
                    // 強制判定落入中央槽
                    processBallLanding(ball, 5);
                    activeBalls.splice(i, 1);
                    continue;
                }

                // 檢查是否到達底部入球區
                if (ball.position.y > height - 35) {
                    let xPos = ball.position.x;
                    let slotIndex = Math.floor((xPos / (width - 35)) * numSlots);
                    if (slotIndex < 0) slotIndex = 0;
                    if (slotIndex >= numSlots) slotIndex = numSlots - 1;

                    processBallLanding(ball, slotIndex);
                    activeBalls.splice(i, 1);
                }
            }

            // 檢查本局所有彈珠是否皆已發射完且全部落入槽內
            if (pendingBallsCount === 0 && activeBalls.length === 0 && gameState === 'LAUNCHING') {
                finalizeGameResults();
            }
        });

        // 處理單顆彈珠入袋結果
        function processBallLanding(ball, slotIndex) {
            Composite.remove(world, ball);
            let isWin = winningSlotsForCurrentGame.includes(slotIndex);
            if (isWin) {
                totalWinThisGame += currentBet * currentMultiplier;
            }
            gameResultsSummary.push({ slot: slotIndex + 1, isWin: isWin });
        }

        // 4. 結算本局結果
        function finalizeGameResults() {
            gameState = 'FINISHED';
            coins += totalWinThisGame;
            updateUI();

            if (totalWinThisGame > 0) {
                playSound('win');
                showMessage(`🎉 中獎！本局獲得 ${totalWinThisGame} 代幣！`, 4000);
            } else {
                showMessage(`😅 可惜沒中獎，再接再厲！`, 3000);
            }

            // 重置按鈕狀態
            document.getElementById('start-btn').innerText = "🔥 開始抽倍率";
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.remove('opacity-50');

            // 數值歸零準備下一局
            totalWinThisGame = 0;
            gameResultsSummary = [];
        }

        // 破產免費重置
        function resetGameCoins() {
            coins = CONFIG.initialCoins;
            updateUI();
            document.getElementById('gameover-modal').classList.add('hidden');
            resetAllLamps();
            clearSlotsIndicator();
            gameState = 'IDLE';
            showMessage("🎁 老闆招待：已補充 100 代幣！", 2500);
        }

        // 初始化介面顯示
        updateUI();
        showMessage("請設定押分並按下黃色大按鈕開始！", 3000);
    </script>
</body>
</html>
